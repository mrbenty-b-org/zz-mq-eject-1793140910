name: attmq
on:
  pull_request:
  merge_group:
permissions:
  id-token: write
  attestations: write
  contents: read
jobs:
  mint:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: payload
        run: |
          mkdir -p out
          printf '%s\n' "MQ-EJECT-1793140910" > out/payload.bin
          echo "MARKER-DIGEST-BEGIN"; sha256sum out/payload.bin; echo "MARKER-DIGEST-END"
          echo "MARKER-EVENT=${{ github.event_name }}"
          echo "MARKER-REF=${{ github.ref }}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: out/payload.bin
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: pass on the PR, fail inside the merge group
        run: |
          echo "MARKER-GATE-EVENT=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "MARKER-GATE=sleeping so mint finishes, then failing to force an EJECTION"
            sleep 90
            exit 1
          fi
          echo "MARKER-GATE=passing on pull_request so the queue admits this PR"
